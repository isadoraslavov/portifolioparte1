<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfólio Acadêmico - CEUB</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#f5f5f5;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#4b0055;
    }

    .container{
      background:white;
      padding:50px;
      border-radius:24px;
      text-align:center;
      width:90%;
      max-width:600px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    .logo{
      width:220px;
      margin-bottom:30px;
    }

    h1{
      font-size:32px;
      margin-bottom:15px;
      color:#4b0055;
    }

    p{
      font-size:17px;
      color:#666;
      line-height:1.6;
      margin-bottom:35px;
    }

    .btn{
      display:inline-block;
      background:#d61c8c;
      color:white;
      text-decoration:none;
      padding:16px 34px;
      border-radius:14px;
      font-size:16px;
      font-weight:bold;
      transition:0.3s;
    }

    .btn:hover{
      background:#4b0055;
      transform:translateY(-2px);
    }

    .footer{
      margin-top:35px;
      font-size:14px;
      color:#999;
    }

  </style>
</head>

<body>

  <div class="container">

    <img 
      class="logo"
      src="https://upload.wikimedia.org/wikipedia/commons/7/72/Logo_CEUB.png"
      alt="Logo CEUB"
    >

    <h1>Projeto Acadêmico</h1>

    <p>
      Repositório desenvolvido para a disciplina de versionamento e colaboração utilizando GitHub.
    </p>

    <a 
      class="btn"
      href="https://portifolio2-0-bay.vercel.app"
      target="_blank"
    >
      Acessar Projeto
    </a>

    <div class="footer">
      Desenvolvido por Isadora Slavov
    </div>

  </div>

</body>
</html>
